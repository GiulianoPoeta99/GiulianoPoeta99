<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0A0C10; }
    .guide { stroke: #141922; stroke-width: 1; }
    .line { stroke: #2A3242; stroke-width: 1.5; }
    .soft-line { stroke: #202735; stroke-width: 1; }
    .accent-line { stroke: #7C8FB5; stroke-width: 1.5; }
    .dot { fill: #AEB9CF; }
    .accent-dot { fill: #D8E2F2; }

    .kicker {
      fill: #7B8496;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .title {
      fill: #F2F5FB;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 40px;
      font-weight: 600;
    }

    .subtitle {
      fill: #A9B2C3;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 18px;
    }

    .section {
      fill: #E7ECF7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 18px;
      font-weight: 600;
    }

    .body {
      fill: #B6C0D2;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 17px;
    }

    .small {
      fill: #7B8496;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
    }
  </style>

  <rect class="bg" width="1400" height="900"/>

  <!-- subtle guides -->
  <line class="guide" x1="80" y1="120" x2="1320" y2="120"/>
  <line class="guide" x1="80" y1="780" x2="1320" y2="780"/>
  <line class="guide" x1="700" y1="80" x2="700" y2="820"/>
  <line class="guide" x1="180" y1="80" x2="180" y2="820"/>
  <line class="guide" x1="1220" y1="80" x2="1220" y2="820"/>

  <!-- header -->
  <text x="120" y="110" class="kicker">github / structural map</text>

  <text x="700" y="170" class="title" text-anchor="middle">Giuliano Ignacio Poeta</text>
  <text x="700" y="205" class="subtitle" text-anchor="middle">software engineer · calm systems thinking · deliberate work</text>

  <!-- central axis -->
  <line class="accent-line" x1="700" y1="245" x2="700" y2="665"/>
  <circle class="accent-dot" cx="700" cy="245" r="4.5"/>
  <circle class="dot" cx="700" cy="350" r="3.5"/>
  <circle class="dot" cx="700" cy="455" r="3.5"/>
  <circle class="dot" cx="700" cy="560" r="3.5"/>
  <circle class="accent-dot" cx="700" cy="665" r="4.5"/>

  <!-- left upper: posture -->
  <path class="line" d="M700 300 C620 300, 570 280, 520 255 C455 222, 370 220, 280 220"/>
  <circle class="dot" cx="280" cy="220" r="4"/>

  <text x="120" y="215" class="kicker">01 / posture</text>
  <line class="soft-line" x1="120" y1="228" x2="420" y2="228"/>
  <text x="120" y="265" class="section">serious, but not loud</text>

  <text x="120" y="312" class="body">clarity over noise</text>
  <text x="120" y="344" class="body">substance over display</text>
  <text x="120" y="376" class="body">depth over urgency</text>
  <text x="120" y="408" class="body">calm over spectacle</text>

  <!-- right upper: identity -->
  <path class="line" d="M700 300 C780 300, 830 280, 880 255 C945 222, 1030 220, 1120 220"/>
  <circle class="dot" cx="1120" cy="220" r="4"/>

  <text x="980" y="215" class="kicker">02 / identity</text>
  <line class="soft-line" x1="980" y1="228" x2="1280" y2="228"/>
  <text x="980" y="265" class="section">measured and reflective</text>

  <text x="980" y="312" class="body">technical without posturing</text>
  <text x="980" y="344" class="body">critical without aggression</text>
  <text x="980" y="376" class="body">minimal without emptiness</text>
  <text x="980" y="408" class="body">precise without rigidity</text>

  <!-- left lower: method -->
  <path class="line" d="M700 505 C620 505, 570 525, 520 550 C455 583, 370 585, 280 585"/>
  <circle class="dot" cx="280" cy="585" r="4"/>

  <text x="120" y="580" class="kicker">03 / method</text>
  <line class="soft-line" x1="120" y1="593" x2="420" y2="593"/>
  <text x="120" y="630" class="section">understand before acting</text>

  <text x="120" y="677" class="body">observe the system</text>
  <text x="120" y="709" class="body">question the default shape</text>
  <text x="120" y="741" class="body">choose structure deliberately</text>
  <text x="120" y="773" class="body">then build with control</text>

  <!-- right lower: focus -->
  <path class="line" d="M700 505 C780 505, 830 525, 880 550 C945 583, 1030 585, 1120 585"/>
  <circle class="dot" cx="1120" cy="585" r="4"/>

  <text x="980" y="580" class="kicker">04 / focus</text>
  <line class="soft-line" x1="980" y1="593" x2="1280" y2="593"/>
  <text x="980" y="630" class="section">where attention goes</text>

  <text x="980" y="677" class="body">system design</text>
  <text x="980" y="709" class="body">developer tooling</text>
  <text x="980" y="741" class="body">clear interfaces</text>
  <text x="980" y="773" class="body">software with intention</text>

  <!-- center notes -->
  <text x="730" y="356" class="small">thinking style</text>
  <text x="730" y="461" class="small">working method</text>
  <text x="730" y="566" class="small">direction of effort</text>

  <!-- footer -->
  <line class="soft-line" x1="120" y1="812" x2="1280" y2="812"/>
  <text x="120" y="842" class="small">one surface · no cards · no badges · no markdown blocks</text>
  <text x="1280" y="842" class="small" text-anchor="end">poetaignacio</text>
</svg>